name: RaceDay CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore RaceDay.Api.slnx

      - name: Build solution
        run: dotnet build RaceDay.Api.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.Api.slnx --configuration Release --no-build
      
